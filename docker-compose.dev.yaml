services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend:/app
      - ./config:/config
      - /docker:/docker
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8080:8000"
    environment:
      - HOME=/tmp
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - DAC_READ_SEARCH
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

  caddy:
    profiles: ["caddy"]
    build:
      context: ./caddy
    volumes:
      - ./caddy/Caddyfile:/etc/caddyfile
      - caddy_data:/data
    command: caddy run --config /etc/caddyfile
    ports:
      - "80:80"
      - "8443:443"
    expose:
      - "2019"
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    networks:
      - default
      - litethaus

networks:
  litethaus:
    name: litethaus

volumes:
  caddy_data:
