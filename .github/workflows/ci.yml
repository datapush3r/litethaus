name: ci

on:
  push:
    branches: [master]
  pull_request: {}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r backend/requirements.txt pytest pip-audit bandit
      - name: Run tests
        working-directory: backend
        run: python -m pytest -q
      - name: Audit dependencies (pip-audit)
        working-directory: backend
        run: pip-audit -r requirements.txt --skip-editable
      - name: Code audit (bandit, high severity)
        working-directory: backend
        run: |
          SRC=$(ls *.py | grep -v '^test_')
          bandit -q $SRC --severity-level high
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@418762f3b91a05e756cec9e3be9d71fa92cfe2ba # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        working-directory: frontend
        run: npm ci
      - name: Typecheck + build
        working-directory: frontend
        run: npm run build
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Unit tests
        working-directory: frontend
        run: npx vitest run
      - name: Audit dependencies (npm audit)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
