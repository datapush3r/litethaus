services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: litethaus
    restart: unless-stopped
    volumes:
      - ./config:/config
      - /docker:/docker
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8000:8000"
    environment:
      - HOME=/tmp
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - DAC_READ_SEARCH
    security_opt:
      - no-new-privileges:true

  caddy:
    profiles: ["caddy"]
    build:
      context: ./caddy
    container_name: litethaus-caddy
    restart: unless-stopped
    volumes:
      - ./caddy/Caddyfile:/etc/caddyfile
      - caddy_data:/data
      - caddy_config:/config
    command: caddy run --config /etc/caddyfile
    ports:
      - "8443:443"
    expose:
      - "2019"
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    networks:
      - default
      - litethaus

networks:
  litethaus:
    name: litethaus

volumes:
  caddy_data:
  caddy_config:
