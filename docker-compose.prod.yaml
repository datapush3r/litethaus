services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: litethaus
    restart: unless-stopped
    volumes:
      - ./config:/config
      - /docker:/docker
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8000:8000"
    environment:
      # Points the docker CLI's config dir at the tmpfs below instead of the
      # (read-only) image's /root, so `docker`/`docker compose` subprocess
      # calls can't hit a permission error trying to write $HOME/.docker.
      - HOME=/tmp
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      # scan() walks every entry under stacks_dir looking for compose files,
      # including dirs it has no business reading (permission errors on
      # someone else's directory). Root normally bypasses those checks via
      # CAP_DAC_OVERRIDE, which cap_drop: ALL also strips - restored (only
      # these two, not ALL) so a restrictive directory it merely stat()s
      # doesn't crash startup.
      - DAC_OVERRIDE
      - DAC_READ_SEARCH
    security_opt:
      - no-new-privileges:true

  caddy:
    profiles: ["caddy"]
    build:
      context: ./caddy
    container_name: litethaus-caddy
    restart: unless-stopped
    volumes:
      - ./caddy/Caddyfile:/etc/caddyfile
      - caddy_data:/data
      - caddy_config:/config
    command: caddy run --config /etc/caddyfile
    ports:
      # Staging port while NPM still owns host 443 - flip to "443:443" only
      # at the atomic cutover once every domain is validated (see plan).
      - "8443:443"
    expose:
      - "2019"
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      # Lets the non-root user above still bind :80/:443.
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    networks:
      - default
      - litethaus

networks:
  litethaus:
    name: litethaus

volumes:
  caddy_data:
  caddy_config:
